<title>Adjuis / Client Meeting Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --ink:#141413;
    --fill:#3a3a3a;
    --fill-hover:#525252;
    --paper:#ffffff;
    --panel:#f0f0ef;
    --panel-line:rgba(20,20,19,.12);
    --accent:#f3a7c6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter','Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:120px;
  }
  button,a,input,textarea,select{font-family:inherit;}
  button{cursor:pointer;}

  header{ padding:26px 40px 10px; }
  .mark-row{ display:flex; align-items:center; gap:12px; margin:0 0 22px; }
  .mark-link{ display:inline-block; }
  .mark{ display:block; height:16px; width:auto; }
  .mark path{ fill:var(--ink); }
  .mark-label{
    display:none; font:inherit; font-size:11.5px; font-weight:600; text-transform:uppercase;
    letter-spacing:.06em; color:rgba(20,20,19,.45); background:none; border:none; padding:0;
    cursor:pointer;
  }
  .mark-label:hover{ color:var(--ink); text-decoration:underline; }
  .mark-label.is-visible{ display:inline-block; margin-left:auto; }
  h1{ font-size:clamp(22px,3vw,28px); margin:0 0 8px; letter-spacing:-.01em; }
  .page-client-sub{ display:none; font-size:13px; color:rgba(20,20,19,.5); margin:-2px 0 8px; }
  .page-client-sub.is-visible{ display:block; }

  main{ max-width:760px; margin:0 auto; padding:10px 40px 0; transition:max-width .2s ease; }
  main.is-wizard-active{ max-width:1080px; }

  .client-block{ background:var(--panel); border-radius:14px; padding:22px 24px; margin:26px 0 24px; }
  .client-block h2{ font-size:14px; text-transform:uppercase; letter-spacing:.08em; margin:0 0 16px; }
  .field-row{ display:flex; flex-wrap:wrap; gap:12px; }
  .field{ flex:1 1 220px; display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12px; font-weight:700; color:rgba(20,20,19,.6); }
  .field input, .field select{
    border:1px solid var(--panel-line); background:#fff;
    border-radius:8px; padding:11px 13px; font-size:14px;
  }
  .field .req{ color:#b4482f; }
  /* Red pin line around a required field left empty when Begin is
     clicked -- added 2026-11-02. Cleared as soon as the person starts
     typing in it. */
  .field input.is-invalid{ border-color:#b4482f; }

  /* Client history lookup -- added 2026-11-02. Appears automatically
     once both name and email are filled in, pulling whatever this
     client already has on file (past Questionnaire/Meeting Assistant
     sessions, from their own tab on the Google Sheet) so Corey doesn't
     have to flip over to the Sheet before a call. Each past session is
     a collapsed row, expandable to its full Q&A. Silently stays hidden
     if the client is new, if SUBMIT_ENDPOINT isn't set, or if the
     lookup fails for any reason -- never blocks starting the meeting. */
  .client-history{ background:var(--panel); border-radius:14px; padding:18px 24px; margin:0 0 24px; }
  .client-history-title{ font-size:13px; font-weight:700; margin:0 0 10px; }
  .client-history-sessions{ display:flex; flex-direction:column; gap:6px; }
  .client-history-row{ border:1px solid var(--panel-line); border-radius:10px; background:#fff; overflow:hidden; }
  .client-history-row-head{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    text-align:left; font:inherit; font-size:13px; font-weight:600;
    padding:10px 14px; background:none; border:none;
  }
  .client-history-row-head::after{ content:'+'; font-weight:400; color:rgba(20,20,19,.4); }
  .client-history-row-head.is-open::after{ content:'\2212'; }
  .client-history-row-body{ padding:0 14px 14px; }
  .client-history-q{ font-size:12px; font-weight:700; color:rgba(20,20,19,.55); margin:10px 0 2px; }
  .client-history-a{ font-size:13.5px; line-height:1.5; margin:0; white-space:pre-wrap; }

  .session-picker{ margin:0 0 30px; }
  .session-picker h2{ font-size:14px; font-weight:700; margin:0 0 12px; }
  .session-list{ display:flex; flex-direction:column; gap:10px; }
  .session-row{ display:flex; align-items:stretch; gap:10px; }
  .session-card{
    display:block; flex:1 1 auto; min-width:0; text-align:left;
    border:1px solid var(--panel-line); background:#fff; border-radius:12px;
    padding:14px 18px;
  }
  .session-card-name{ font-size:14px; font-weight:700; margin:0 0 4px; }
  .session-card-desc{ font-size:12.5px; line-height:1.5; color:rgba(20,20,19,.55); margin:0; }
  .session-card.is-selected{ border-color:var(--ink); background:var(--panel); }
  .session-card.is-selected .session-card-desc{ color:rgba(20,20,19,.65); }
  /* Begin button that appears to the right of a session card on hover --
     added 2026-11-02, so starting a session doesn't need a scroll down to
     the Begin button at the bottom of the page. */
  .session-begin-inline{
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto; align-self:stretch; white-space:nowrap;
    background:var(--fill); color:#fff; border:none; border-radius:9px;
    padding:0 28px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    opacity:0; pointer-events:none; transition:opacity .15s ease;
  }
  .session-row:hover .session-begin-inline,
  .session-begin-inline:focus,
  .session-row.is-selected-row .session-begin-inline{ opacity:1; pointer-events:auto; }
  @media (max-width:640px){
    /* No hover on touch -- keep it reachable instead of permanently hidden. */
    .session-begin-inline{ opacity:1; pointer-events:auto; padding:0 20px; }
  }

  .start-row{ margin:0 0 40px; }
  .start-msg{ font-size:13px; margin-top:10px; color:#b4482f; min-height:18px; }

  /* ---------- One-question-at-a-time wizard (same engine/shape as the
     Client Questionnaire page) ---------- */
  /* Mind map always sits below the questions now (desktop and mobile
     alike), giving the question column the full width -- changed
     2026-11-02, was a side-by-side grid on desktop. */
  .wizard-layout{ display:flex; flex-direction:column; gap:36px; }
  .wizard-side-heading{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:rgba(20,20,19,.5); margin:0 0 10px;
  }
  .wizard-side{ position:static; }
  .wizard-progress{ margin:0 0 22px; }
  .wizard-pills-wrap{ display:flex; align-items:center; gap:8px; margin:0 0 8px; }
  /* Fixed (not min) height, sized for two lines -- fixed 2026-11-02 so a
     long question wrapping onto an extra line no longer pushes the
     question box below up and down when a different pill is hovered. */
  .wizard-pill-hover-label{ font-size:12.5px; color:rgba(20,20,19,.55); text-align:left; line-height:1.4; height:35px; overflow:hidden; }
  .wizard-pills{
    display:flex; gap:8px; overflow-x:auto; scroll-behavior:smooth; padding:2px; scrollbar-width:none;
  }
  .wizard-pills::-webkit-scrollbar{ display:none; }
  .wizard-pill{
    flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:1px solid var(--panel-line);
    background:#fff; color:var(--ink); font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .wizard-pill:hover{ border-color:var(--ink); }
  .wizard-pill.is-answered{ border-color:var(--ink); }
  .wizard-pill.is-current{ background:var(--fill); color:#fff; border-color:var(--fill); }
  .wizard-pill-arrow{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:1px solid var(--panel-line);
    background:#fff; color:var(--ink); font-size:14px; display:flex; align-items:center; justify-content:center;
  }
  .wizard-pill-arrow:hover{ border-color:var(--ink); }
  .wizard-step{ min-height:220px; margin:0 0 20px; }
  .wizard-question{ font-size:18px; font-weight:700; line-height:1.4; margin:0 0 18px; max-width:600px; }
  .wizard-step textarea{
    width:100%; min-height:120px; resize:vertical;
    border:1px solid var(--panel-line); background:var(--panel);
    border-radius:10px; padding:14px 16px; font-size:15px; line-height:1.55;
  }
  .wizard-step textarea:focus{ outline:2px solid var(--ink); outline-offset:1px; }
  .choice-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .choice-chip{
    border:1px solid var(--panel-line); background:#fff; color:var(--ink);
    border-radius:999px; padding:12px 22px; font-size:14px; font-weight:600;
  }
  .choice-chip:hover{ border-color:var(--ink); }
  .choice-chip.is-selected{ background:var(--fill); color:#fff; border-color:var(--fill); }
  .wizard-step-hint{ font-size:12.5px; color:rgba(20,20,19,.5); margin:8px 0 0; }
  .wizard-date-input{
    border:1px solid var(--panel-line); background:var(--panel); color:var(--ink);
    border-radius:8px; padding:11px 13px; font-size:14px; max-width:240px;
  }
  .wizard-date-input:focus{ outline:2px solid var(--ink); outline-offset:1px; }
  .wizard-short-input{
    display:block; width:100%; max-width:420px;
    border:1px solid var(--panel-line); background:var(--panel); color:var(--ink);
    border-radius:8px; padding:11px 13px; font-size:14px; margin:0 0 10px;
  }
  .wizard-short-input:focus{ outline:2px solid var(--ink); outline-offset:1px; }
  .date-range-row{ display:flex; gap:20px; flex-wrap:wrap; }
  .date-range-row > div{ display:flex; flex-direction:column; gap:6px; }
  .date-range-duration{ font-size:13px; color:rgba(20,20,19,.6); margin:10px 0 0; }
  .red-flags-wrap{ max-width:420px; }
  .poc-entry{ padding:14px 0; border-bottom:1px solid var(--panel-line); margin:0 0 14px; }
  .poc-entry:last-of-type{ border-bottom:none; margin-bottom:0; }
  .poc-best-way{ margin:0 0 4px; }

  .link-list-row{ display:flex; gap:10px; align-items:center; margin:0 0 10px; max-width:560px; }
  .link-list-input{
    flex:1 1 auto; border:1px solid var(--panel-line); background:var(--panel); color:var(--ink);
    border-radius:8px; padding:11px 13px; font-size:14px;
  }
  .link-list-input:focus{ outline:2px solid var(--ink); outline-offset:1px; }
  .link-list-remove{
    flex:0 0 auto; width:32px; height:32px; border-radius:50%; border:1px solid var(--panel-line);
    background:#fff; color:var(--ink); font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .link-list-remove:hover{ border-color:#b4482f; color:#b4482f; }

  .mindmap-widget{ margin-top:4px; }
  .mindmap-toolbar{ display:flex; flex-wrap:wrap; gap:10px; margin:0 0 10px; }
  .mindmap-input{
    flex:1 1 220px; border:1px solid var(--panel-line); background:var(--panel); color:var(--ink);
    border-radius:8px; padding:11px 13px; font-size:14px;
  }
  .mindmap-input:focus{ outline:2px solid var(--ink); outline-offset:1px; }
  .mindmap-hint{ margin:0 0 4px; }
  .mindmap-selected-tag{ font-weight:700; color:rgba(20,20,19,.7); margin:0 0 10px; }
  .mindmap-canvas{
    position:relative; width:100%; height:360px; min-height:220px; border:1px solid var(--panel-line);
    border-radius:12px; background:var(--panel); overflow:hidden; touch-action:none;
    resize:vertical;
  }
  .mindmap-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .mindmap-line{ stroke:rgba(20,20,19,.3); stroke-width:.6; vector-effect:non-scaling-stroke; }
  .mindmap-node{
    position:absolute; transform:translate(-50%,-50%);
    background:#fff; border:1.5px solid var(--panel-line); border-radius:999px;
    padding:9px 16px; font-size:13px; font-weight:700; color:var(--ink);
    max-width:160px; text-align:center; cursor:grab; user-select:none;
    box-shadow:0 1px 3px rgba(20,20,19,.08);
  }
  .mindmap-node.is-root{ background:var(--fill); color:#fff; border-color:var(--fill); }
  .mindmap-node.is-selected{ outline:2px solid var(--ink); outline-offset:2px; }
  .mindmap-node.is-editing{
    cursor:text; -webkit-user-select:text; user-select:text;
    outline:2px solid var(--ink); outline-offset:2px;
  }

  .wizard-nav{ display:flex; align-items:center; gap:14px; }
  .wizard-btn{ font:inherit; border-radius:9px; padding:13px 28px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
  .wizard-btn.is-primary{ background:var(--fill); color:#fff; border:none; }
  .wizard-btn.is-secondary{ background:none; border:1px solid var(--panel-line); color:var(--ink); }
  .wizard-btn.is-secondary:disabled{ opacity:.35; cursor:default; }
  .wizard-skip{ background:none; border:none; font-size:12.5px; color:rgba(20,20,19,.5); text-decoration:underline; margin-left:auto; }

  .submit-cta{
    background:var(--fill); color:#fff; border:none; border-radius:9px;
    padding:14px 34px; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  }
  .submit-msg{ font-size:13px; margin-top:12px; min-height:18px; }
  .submit-msg.is-bad{ color:#b4482f; }

  .submit-success{ display:none; }
  .submit-success-check{ color:#2f7d4f; font-weight:700; font-size:15px; margin:0 0 10px; }
  .submit-success-copy{ font-size:13.5px; line-height:1.65; color:rgba(20,20,19,.75); margin:0 0 20px; max-width:420px; }

  .copy-actions{ display:flex; flex-wrap:wrap; gap:10px; margin:0 0 16px; }
  .copy-actions-btn{
    font:inherit; font-size:13px; font-weight:700; padding:10px 16px; border-radius:999px;
    border:1px solid var(--panel-line); background:#fff; color:var(--ink); cursor:pointer;
  }
  .copy-actions-btn:hover{ border-color:var(--ink); }
  .copy-actions-msg{ font-size:12.5px; margin:0 0 4px; min-height:1em; color:rgba(20,20,19,.65); }
  .copy-actions-msg.is-ok{ color:#2f7d4f; }
  .copy-actions-msg.is-bad{ color:#b4482f; }

  @media (max-width:640px){
    header{ padding:22px 20px 6px; }
    main{ padding:10px 20px 0; }
    .client-block{ padding:18px; }
    .wizard-question{ font-size:16.5px; }
    .mindmap-canvas{ height:300px; }
  }

  /* ---------- Gate (Landing) -- same cloud-video opener as the Pricing
     tool, just with this page's own title/copy. Sits on top of
     everything (fixed, full-bleed) until "Begin" is clicked, then
     hides to reveal the page underneath, which has been there the
     whole time. */
  #pageGate{ position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center; }
  #pageGate.is-hidden{ display:none; }
  #gateVideo{ position:fixed; inset:0; z-index:0; width:100vw; height:100vh; object-fit:cover; background:#2a1f33; }
  .gate-inner{
    position:relative; z-index:1;
    text-align:center; padding:0 24px; color:#fff;
    opacity:0; animation:gateIn 1s ease .1s forwards;
  }
  @keyframes gateIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .gate-mark{ width:clamp(130px,16vw,180px); display:block; margin:0 auto 28px; }
  .gate-mark path{ fill:#fff; }
  .gate-title{ margin:0 0 18px; font-size:clamp(22px,3vw,30px); letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
  .gate-copy{ max-width:520px; margin:0 auto; font-size:15px; line-height:1.6; color:rgba(255,255,255,.88); }
  .gate-cta{
    margin-top:36px; display:inline-block; font:inherit;
    background:var(--fill); color:#fff; border:none; border-radius:9px;
    padding:13px 34px; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    transition:background .2s ease, transform .2s ease;
  }
  .gate-cta:hover{ background:var(--fill-hover); transform:translateY(-1px); }
</style>

<script>
/* Gate (landing) -- same cloud-video opener used on the Pricing tool.
   Plays the background video and, on "Begin", hides the gate to reveal
   the page underneath (which has been there all along). */
(function(){
  var v = document.getElementById('gateVideo');
  if(v){
    v.src = 'https://media.adjuis.com/bg-pink-purple-clouds.mp4';
    var p = v.play();
    if(p && p.catch){ p.catch(function(){}); }
  }
  var gate = document.getElementById('pageGate');
  var beginBtn = document.getElementById('gateBeginBtn');
  if(beginBtn && gate){
    beginBtn.addEventListener('click', function(){
      gate.classList.add('is-hidden');
      if(v){ v.pause(); }
    });
  }
})();

/* Same Apps Script Web App URL as the pricing page and the Client
   Questionnaire page (see adjuis-estimates-Code.gs). This page POSTs
   with type:'meetingNote', which that script routes to the client's own
   tab, never the master Estimates sheet. Left blank, the form still
   confirms locally but nothing is recorded remotely. */
var SUBMIT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzDV9zfsHs9aYV1C_p4VSwzOyAZStEUWsbNp0bEdsDN6B2d0E3PrywNQbvkhnilg7cVAQ/exec';

/* ---------------------------------------------------------------------- */
/* One question at a time, added 2026-10-24 -- replaces the old
   pick-a-session / single-generic-notes-field layout. Consultation Call,
   Kickoff Call and General Check-in are fixed question lists (with a
   couple of ITTT branches via showIf, same mechanism as the Client
   Questionnaire page). Moodboard Review and Design/Concept Review are
   built on the fly -- see buildRepeaterSteps -- since they repeat once
   per moodboard/concept: answering a repeater's "Add another?" question
   SPLICES a fresh set of steps into the live STEPS array right after it,
   via the same onAdvance hook the wizard engine calls on every Next. */
function showIfEquals(key, acceptedValues){
  return function(byKey){
    if(byKey[key] === undefined) return true;
    return acceptedValues.indexOf(byKey[key]) !== -1;
  };
}
/* For a step conditional on TWO levels of branching at once (its own
   decider is itself only reachable through another condition, like
   "did the target date change?" which only shows after "has anything
   changed?" = Yes). A plain showIfEquals on just the inner key would
   stay visible forever once the outer branch resolves "No", since the
   inner key then never gets set at all. This checks every condition,
   each defaulting to visible only while that key is still unanswered. */
function showIfAll(conditions){
  return function(byKey){
    return conditions.every(function(c){
      if(byKey[c.key] === undefined) return true;
      return c.accepted.indexOf(byKey[c.key]) !== -1;
    });
  };
}

function buildConsultationSteps(){
  var s = 'Consultation Call';
  return [
    { section:s, type:'text', q:"What's the energy of the client like on this call?" },
    { section:s, type:'text', q:'How do you feel about the project itself, personally?' },
    { section:s, type:'text', q:'Based on this initial read, does this feel like a good fit between Adjuis and this client?' },

    { section:s, type:'text', q:"What's the budget?" },
    { section:s, type:'text', q:"What's needed for that budget? What does it need to cover?" },
    { section:s, type:'select', key:'budgetWiggleRoom', options:['Yes','No'], q:'Is there wiggle room on the budget?' },
    { section:s, type:'select', key:'budgetRealistic', options:['Yes','No'], q:'Is the budget realistic for the scope being described?' },

    { section:s, type:'dateRange', q:"What's the timeline?" },
    { section:s, type:'select', key:'timelineRealistic', options:['Yes','No'], q:'Is the timeline realistic on both sides?' },

    { section:s, type:'nameField', fieldLabel:"Decision maker's name", q:"Who's the decision maker?" },

    { section:s, type:'select', key:'fitRedFlag', options:['No red flags','Red flag raised'], q:'Did the questionnaire or this conversation raise any red flags?' },
    { section:s, type:'redFlags', showIf:showIfEquals('fitRedFlag', ['Red flag raised']), q:'What are the red flags, specifically?' },

    { section:s, type:'text', q:'What would describe success for this project?' },

    { section:s, type:'text', q:"How do they like to collaborate with a creative partner? What's worked well before, and what hasn't?" },
    { section:s, type:'text', q:'Do they find the creative process itself fun, or is it mostly a means to an end for them?' },
    { section:s, type:'text', q:"What's some work, in or out of their industry, that they think is great creative? What makes it great to them?" }
  ];
}

function buildKickoffSteps(){
  var s = 'Kickoff Call';
  return [
    { section:s, type:'text', q:'Any last questions about the signed timeline or scope before diving in?' },
    { section:s, type:'pointOfContact', q:"Who's the main point of contact going forward?" },

    { section:s, type:'select', key:'kickoffChanged', options:['Yes','No'], q:'Has anything changed since the Questionnaire was filled out, budget, timeline, decision makers, or scope?' },
    { section:s, type:'text', showIf:showIfEquals('kickoffChanged', ['Yes']), q:'What changed, specifically?' },
    { section:s, type:'select', key:'kickoffDateChanged', showIf:showIfEquals('kickoffChanged', ['Yes']), options:['Yes','No'], q:'Did the target date change?' },
    { section:s, type:'date', dateLabel:'New target date',
      showIf:showIfAll([{ key:'kickoffChanged', accepted:['Yes'] }, { key:'kickoffDateChanged', accepted:['Yes'] }]),
      q:'What is the new target date?' },

    // Copied from the Client Questionnaire (q7/q8 stay there too -- see
    // questionnaire.html) and moved from it (q26/q27, no longer asked
    // there), per Corey's 2026-10-30 notes, so Corey can revisit them
    // live once the relationship is underway.
    { section:s, type:'text', q:'Revisiting the Questionnaire: what are their goals for this project, beyond a great logo or a nice website? Anything changed since they first answered?' },
    { section:s, type:'text', q:"Revisiting the Questionnaire: if this project is a complete success a year from now, what's changed for the business? Anything changed since they first answered?" },
    { section:s, type:'text', q:'What is the mission, in their own words, not the version on the website?' },
    { section:s, type:'text', q:'What would the founders want people to feel, not just think, when they encounter this brand?' },

    { section:s, type:'text', q:'What does the client want to see or hear from Adjuis in the first week to feel confident this is moving?' },
    { section:s, type:'text', q:"Anything they're nervous about now that the engagement is official?" },
    { section:s, type:'text', q:'How will we communicate going forward? What\'s the best way?' },
    { section:s, type:'text', q:'Any logistics left to confirm, meeting cadence, file sharing?' }
  ];
}

/* Added 2026-10-31, Corey's own prep research before a meeting, not a
   client-facing session at all -- link lists for the client's own site,
   competitors, and Corey's own research, plus a few framing questions
   and a live mind map Corey can build out and rearrange on the fly. */
function buildResearchAssistantSteps(){
  var s = 'Research Assistant';
  return [
    { section:s, type:'linkList', q:"Links to the client's own website and any existing brand materials." },
    { section:s, type:'linkList', q:'Links to competitors worth looking at.' },
    { section:s, type:'linkList', q:"Links to your own research, anything that speaks to what they've told you." },

    { section:s, type:'text', q:"Who is the customer for this client?" },
    { section:s, type:'text', q:'What does the customer want?' },

    { section:s, type:'text', q:'Who do you think their competitors actually are?' },
    { section:s, type:'text', q:"What problem do you think you're solving for them?" },

    { section:s, type:'select', key:'raAligned', options:['Yes','No'], q:'Are you aligned with the client here?' },
    { section:s, type:'text', showIf:showIfEquals('raAligned', ['No']), q:"Where's the gap?" }
  ];
}

function buildGeneralMeetingSteps(){
  var s = 'General Meeting';
  return [
    { section:s, type:'text', q:'How are you feeling about the designs?' },
    { section:s, type:'text', q:"Let's discuss any concerns." },
    { section:s, type:'text', q:"Let's discuss what you like." }
  ];
}

/* A live follow-up on everything the client already answered on
   brand-look-feel.html, per Corey's "question should reflect everything
   from the brand look and feel" note (2026-10-30). Mirrors that page's
   full question set one-for-one, in the same order, phrased for Corey to
   walk through on a call rather than as client-facing copy.

   Re-matched to brand-look-feel.html's current question set on
   2026-11-02, per Corey's "make sure the questions match" request --
   that page's order had drifted from this list (Customer & Audience,
   Competitive Landscape and Business Context used to interleave
   differently here), Q6 changed from "three to five words" to "one
   sentence" there, this list was still asking the two investment
   questions that moved out to questionnaire.html on 2026-11-02, and the
   hidden-gem follow-up detail question was missing entirely. All fixed
   below. If brand-look-feel.html's own question set changes again
   later, update this list to match.

   Also opens with a quick project-type confirmation, per Corey's
   request, using the same CATEGORIES list as the Pricing page and
   Client Questionnaire (see pricing-data.js) so it's never a separate
   list to maintain. */
function buildBrandFeelMeetingSteps(){
  var s = 'Brand Look & Feel Meeting';
  return [

/* kind: 'mood' (Moodboard Review) or 'concept' (Design / Concept Review).
   Builds the first item's questions + its "Add another?" step; picking
   "Add another" on that step splices a fresh item + a fresh "Add
   another?" step right after it, so the loop can repeat as many times
   as the call actually needs before falling through to the fixed
   overall-approval steps at the end. */
function buildRepeaterSteps(kind){
  var sectionName = kind === 'mood' ? 'Moodboard Review' : 'Design / Concept Review';
  var label = kind === 'mood' ? 'Moodboard' : 'Concept';
  var letterCode = 65; // 'A' for the first item; bumped before each later one

  function itemSteps(letter){
    var decisionKey = kind + 'Decision_' + letter;
    var steps = [
      { section:sectionName, type:'text', q:"What was the client's reaction to " + label + ' ' + letter + '?',
        extraField:{ key:kind + 'Name_' + letter, label:label + ' name', placeholder:'e.g. ' + (kind === 'mood' ? 'Warm & Minimal' : 'Bold Type Concept') } }
    ];
    if(kind === 'mood'){
      steps.push({ section:sectionName, type:'select', key:'moodMatches_'+letter, options:['Yes','Partially','No'], q:'Does ' + label + ' ' + letter + ' match the approved Recap Brief?' });
    } else {
      steps.push({ section:sectionName, type:'text', q:'What goal or pain point does ' + label + ' ' + letter + ' address?' });
    }
    steps.push({ section:sectionName, type:'select', key:decisionKey, options:['Keep','Adjust','Cut'], q:'Keep, Adjust, or Cut ' + label + ' ' + letter + '?' });
    steps.push({ section:sectionName, type:'text', showIf:showIfEquals(decisionKey, ['Adjust','Cut']), q:'What needs to change about ' + label + ' ' + letter + '?' });
    return steps;
  }

  function decisionStep(){
    return {
      section:sectionName, type:'select', key:kind+'AddAnother',
      options:['Add another ' + label.toLowerCase(), "No, that's all"],
      q:'Add another ' + label.toLowerCase() + '?',
      onAdvance:function(atIndex, chosenValue){
        if(chosenValue === 'Add another ' + label.toLowerCase()){
          letterCode++;
          var nextLetter = String.fromCharCode(letterCode);
          var newSteps = itemSteps(nextLetter).concat([decisionStep()]);
          STEPS.splice.apply(STEPS, [atIndex + 1, 0].concat(newSteps));
        }
      }
    };
  }

  var steps = itemSteps('A').concat([decisionStep()]);
  var approvalNoun = kind === 'mood' ? 'moodboard' : 'design';
  steps.push({ section:sectionName, type:'select', key:kind+'Approved', options:['Yes','Not yet'], q:'Is the ' + approvalNoun + ' direction approved overall?' });
  steps.push({ section:sectionName, type:'text', q:'Any additional notes on the approval decision?' });
  return steps;
}

function buildSessionSteps(session){
  if(session === 'Consultation Call') return buildConsultationSteps();
  if(session === 'Kickoff Call') return buildKickoffSteps();
  if(session === 'Research Assistant') return buildResearchAssistantSteps();
  if(session === 'Brand Look & Feel Meeting') return buildBrandFeelMeetingSteps();
  if(session === 'General Meeting') return buildGeneralMeetingSteps();
  if(session === 'Moodboard Review') return buildRepeaterSteps('mood');
  if(session === 'Design / Concept Review') return buildRepeaterSteps('concept');
  return [];
}

   onAdvance hook (used only by the Moodboard/Concept repeater's "Add

/* Human-readable length of time between the two dateRange inputs --
   added 2026-10-31. Shown live below the From/To date boxes once both
   are filled in. */
function formatDateRangeDuration(fromVal, toVal){
  if(!fromVal || !toVal) return '';
  var from = new Date(fromVal + 'T00:00:00');
  var to = new Date(toVal + 'T00:00:00');
  if(isNaN(from.getTime()) || isNaN(to.getTime())) return '';
  if(to.getTime() === from.getTime()) return 'Same day';
  if(to < from) return 'End date is before the start date';

  var months = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
  var temp = new Date(from.getTime());
  temp.setMonth(temp.getMonth() + months);
  if(temp > to){
    months--;
    temp = new Date(from.getTime());
    temp.setMonth(temp.getMonth() + months);
  }
  var days = Math.round((to - temp) / 86400000);

  var parts = [];
  if(months > 0) parts.push(months + (months === 1 ? ' month' : ' months'));
  if(days > 0 || parts.length === 0) parts.push(days + (days === 1 ? ' day' : ' days'));
  return parts.join(', ') + ' total';
}

/* Auto-formats a phone input to (xxx) xxx-xxxx as digits are typed. */
function formatPhoneAsTyped(el){
  el.addEventListener('input', function(){
    var digits = el.value.replace(/\D/g, '').slice(0, 10);
    var out = digits;
    if(digits.length > 6) out = '(' + digits.slice(0, 3) + ') ' + digits.slice(3, 6) + '-' + digits.slice(6);
    else if(digits.length > 3) out = '(' + digits.slice(0, 3) + ') ' + digits.slice(3);
    else if(digits.length > 0) out = '(' + digits;
    el.value = out;
  });
}

function savePointOfContactWidget(idx){

    if(!bits.length) return '';
    return (entries.length > 1 ? 'Contact ' + (i + 1) + ': ' : '') + bits.join(', ');
  }).filter(Boolean);
  return parts.join(' | ');
}

/* Mind map -- added 2026-10-31, originally a single Research Assistant
   step, now a persistent side panel for EVERY session type (one map per
   assistant, keyed by session name rather than by STEPS index -- see
   renderMindMapSide, built once when a session starts and left alone
   while the question column underneath it changes). Nodes are stored as
   {id, label, parentId, x, y} with x/y in percent of the canvas (so the
   SVG connector overlay, drawn in a 0-100 viewBox with
   preserveAspectRatio="none", lines up with the percent-positioned node
   divs with no pixel math). id 0 is the implicit root ("Client") and
   can't be deleted. Clicking a node selects it as the parent for the
   next added node; dragging (Pointer Events, so mouse and touch both
   work) repositions a node in place. Deleting a node cascades to its
   descendants. The live diagram can't be captured in a spreadsheet cell,
   so saveMindMapWidget flattens it to an indented text outline instead. */
var MINDMAP_CHILD_ANGLE_STEP = 47; // a golden-angle-ish spread so siblings don't land on top of each other
/* The root node's label, added 2026-11-01 -- the company name if one was
   given, otherwise the client's own name, falling back to the literal
   word "Client" only if somehow neither was filled in. */
function getClientLabel(){
  var company = document.getElementById('cCompany').value.trim();
  var name = document.getElementById('cName').value.trim();
  return company || name || 'Client';
}
function ensureMindMapState(idx){
  if(!mindMapValues[idx]){
    mindMapValues[idx] = { nodes:[{ id:0, label:getClientLabel(), parentId:null, x:50, y:14 }], nextId:1, selectedId:0 };
  }
}
function buildMindMapWidget(idx){
  ensureMindMapState(idx);
  var state = mindMapValues[idx];

  var outer = document.createElement('div');
  outer.className = 'mindmap-widget';

  var toolbar = document.createElement('div');
  toolbar.className = 'mindmap-toolbar';
  var labelInput = document.createElement('input');
  labelInput.type = 'text';
  labelInput.className = 'mindmap-input';
  labelInput.placeholder = 'New node label';
  var addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'copy-actions-btn';
  addBtn.textContent = '+ Add Node';
  var removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.className = 'copy-actions-btn';
  removeBtn.textContent = 'Remove Selected';
  toolbar.appendChild(labelInput);
  toolbar.appendChild(addBtn);
  toolbar.appendChild(removeBtn);
  outer.appendChild(toolbar);

  var hint = document.createElement('p');
  hint.className = 'wizard-step-hint mindmap-hint';
  hint.textContent = 'Click a node to select it, then add a node to branch off it. Drag any node to move it.';
  outer.appendChild(hint);

  var selectedTag = document.createElement('p');
  selectedTag.className = 'wizard-step-hint mindmap-selected-tag';
  outer.appendChild(selectedTag);

  var canvasWrap = document.createElement('div');
  canvasWrap.className = 'mindmap-canvas';
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'mindmap-svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.setAttribute('preserveAspectRatio', 'none');
  canvasWrap.appendChild(svg);
  outer.appendChild(canvasWrap);

  function nodeById(id){ return state.nodes.filter(function(n){ return n.id === id; })[0]; }
  function childrenOf(id){ return state.nodes.filter(function(n){ return n.parentId === id; }); }
  function descendantIds(id){
    var out = [];
    childrenOf(id).forEach(function(c){ out.push(c.id); out = out.concat(descendantIds(c.id)); });
    return out;
  }

  function redrawLines(){
    svg.innerHTML = '';
    state.nodes.forEach(function(n){
      if(n.parentId === null) return;
      var p = nodeById(n.parentId);
      if(!p) return;
      var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', p.x); line.setAttribute('y1', p.y);
      line.setAttribute('x2', n.x); line.setAttribute('y2', n.y);
      line.setAttribute('class', 'mindmap-line');
      svg.appendChild(line);
    });
  }

  function updateSelectedTag(){
    var sel = nodeById(state.selectedId) || nodeById(0);
    selectedTag.textContent = 'Selected: ' + (sel ? sel.label : 'Client') + (sel && sel.id === 0 ? ' (root)' : '');
  }

  function renderNodes(){
    canvasWrap.querySelectorAll('.mindmap-node').forEach(function(el){ el.remove(); });
    state.nodes.forEach(function(n){
      var nodeEl = document.createElement('div');
      nodeEl.className = 'mindmap-node' + (n.id === 0 ? ' is-root' : '') + (state.selectedId === n.id ? ' is-selected' : '');
      nodeEl.textContent = n.label || '(untitled)';
      nodeEl.style.left = n.x + '%';
      nodeEl.style.top = n.y + '%';
      nodeEl.dataset.nodeId = n.id;

      var dragging = false, moved = false, startX = 0, startY = 0, editing = false;
      nodeEl.addEventListener('pointerdown', function(ev){
        if(editing) return; // let a click inside the editable text place the cursor instead of starting a drag
        dragging = true; moved = false;
        startX = ev.clientX; startY = ev.clientY;
        try{ nodeEl.setPointerCapture(ev.pointerId); }catch(e){}
      });
      nodeEl.addEventListener('pointermove', function(ev){
        if(!dragging || editing) return;
        var dx = ev.clientX - startX, dy = ev.clientY - startY;
        if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
        if(!moved) return;
        var rect = canvasWrap.getBoundingClientRect();
        var pctX = ((ev.clientX - rect.left) / rect.width) * 100;
        var pctY = ((ev.clientY - rect.top) / rect.height) * 100;
        n.x = Math.max(4, Math.min(96, pctX));
        n.y = Math.max(4, Math.min(96, pctY));
        nodeEl.style.left = n.x + '%';
        nodeEl.style.top = n.y + '%';
        redrawLines();
      });
      nodeEl.addEventListener('pointerup', function(ev){
        dragging = false;
        if(editing) return;
        if(!moved){
          /* Select in place rather than calling renderNodes() -- rebuilding
             every node here would swap this element out for a new one mid
             click, and the browser only fires a native dblclick when both
             clicks land on the SAME element, so a full re-render here was
             silently breaking double-click-to-edit. Added 2026-11-02. */
          state.selectedId = n.id;
          canvasWrap.querySelectorAll('.mindmap-node').forEach(function(el){ el.classList.remove('is-selected'); });
          nodeEl.classList.add('is-selected');
          redrawLines();
          updateSelectedTag();
        }
      });

      /* Double-click to edit a node's copy in place -- added 2026-11-02.
         Turns the node itself into an editable text field; Enter or
         clicking away saves it, Escape discards the change. */
      function finishEditing(save){
        editing = false;
        nodeEl.contentEditable = 'false';
        nodeEl.classList.remove('is-editing');
        if(save){
          var newLabel = nodeEl.textContent.replace(/\s+/g, ' ').trim();
          n.label = newLabel || '(untitled)';
        }
        renderNodes();
        redrawLines();
        updateSelectedTag();
      }
      nodeEl.addEventListener('dblclick', function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        dragging = false; moved = false; editing = true;
        nodeEl.contentEditable = 'true';
        nodeEl.classList.add('is-editing');
        nodeEl.focus();
        var range = document.createRange();
        range.selectNodeContents(nodeEl);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      });
      nodeEl.addEventListener('keydown', function(ev){
        if(!editing) return;
        if(ev.key === 'Enter'){ ev.preventDefault(); finishEditing(true); }
        else if(ev.key === 'Escape'){ ev.preventDefault(); nodeEl.textContent = n.label; finishEditing(false); }
      });
      nodeEl.addEventListener('blur', function(){
        if(editing) finishEditing(true);
      });
      canvasWrap.appendChild(nodeEl);
    });
  }

  addBtn.addEventListener('click', function(){
    var label = labelInput.value.trim();
    if(!label) return;
    var parent = nodeById(state.selectedId) || nodeById(0);
    var siblingCount = childrenOf(parent.id).length;
    var angleRad = ((siblingCount * MINDMAP_CHILD_ANGLE_STEP) % 360) * Math.PI / 180;
    var x = Math.max(6, Math.min(94, parent.x + 20 * Math.cos(angleRad)));
    var y = Math.max(10, Math.min(94, parent.y + 16 * Math.sin(angleRad) + 6));
    var id = state.nextId++;
    state.nodes.push({ id:id, label:label, parentId:parent.id, x:x, y:y });
    state.selectedId = id;
    labelInput.value = '';
    renderNodes();
    redrawLines();
    updateSelectedTag();
  });
  labelInput.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter'){ ev.preventDefault(); addBtn.click(); }
  });

  removeBtn.addEventListener('click', function(){
    if(state.selectedId === 0) return; // the root can't be removed
    var toRemove = [state.selectedId].concat(descendantIds(state.selectedId));
    state.nodes = state.nodes.filter(function(n){ return toRemove.indexOf(n.id) === -1; });
    state.selectedId = 0;
    renderNodes();
    redrawLines();
    updateSelectedTag();
  });

  renderNodes();
  redrawLines();
  updateSelectedTag();
  return outer;
}
function serializeMindMapNodes(nodes){
  var byParent = {};
  nodes.forEach(function(n){
    var key = n.parentId === null ? 'root' : n.parentId;
    if(!byParent[key]) byParent[key] = [];
    byParent[key].push(n);
  });
  var root = nodes.filter(function(n){ return n.parentId === null; })[0];
  if(!root) return '';
  var lines = [];
  function walk(node, depth){
    lines.push(new Array(depth + 1).join('  ') + '- ' + (node.label || '(untitled)'));
    (byParent[node.id] || []).forEach(function(child){ walk(child, depth + 1); });
  }
  walk(root, 0);
  return lines.join('\n');
}
function saveMindMapWidget(idx){
  var state = mindMapValues[idx];
  if(!state) return '';
  return serializeMindMapNodes(state.nodes);
}
/* Builds the side mind map panel once, when a session starts (see the
   maStartBtn handler) -- not on every step render, so dragging/adding
   nodes isn't disturbed by moving between questions underneath it. */
function renderMindMapSide(session){
  ensureMindMapState(session);
  // Keep the root node's label current with whatever is in the Company/
  // Client fields right now, even for a session whose map already
  // existed from an earlier run (those fields could have changed since).
  var rootNode = mindMapValues[session].nodes.filter(function(n){ return n.id === 0; })[0];
  if(rootNode) rootNode.label = getClientLabel();

  var host = document.getElementById('wizardSide');
  host.innerHTML = '';
  var heading = document.createElement('p');
  heading.className = 'wizard-side-heading';
  heading.textContent = session + ' -- Mind Map';
  host.appendChild(heading);
  host.appendChild(buildMindMapWidget(session));
}
/* A session's mind map only counts as "used" once something has been
   added beyond the implicit root, so an untouched map doesn't show up
   as a blank "Mind Map: - Client" line in every submission. */
function hasMindMapContent(session){
  var state = mindMapValues[session];
  return !!(state && state.nodes.length > 1);
}

function stepIsVisible(step){
  return !step.showIf || step.showIf(answersByKey) === true;
}
function findNext(fromIdx){
  var i = fromIdx + 1;
  while(i < STEPS.length && !stepIsVisible(STEPS[i])) i++;
  return i; // may equal STEPS.length (end of this session's questions)
}
function findPrev(fromIdx){
  var i = fromIdx - 1;
  while(i >= 0 && !stepIsVisible(STEPS[i])) i--;
  return i; // may be -1 (back to the intro screen)
}
function visibleTotal(){
  return STEPS.filter(stepIsVisible).length;
}
function visiblePosition(idx){
  var pos = 0;
  for(var i = 0; i <= idx; i++){ if(stepIsVisible(STEPS[i])) pos++; }
  return pos;
}

/* Clickable pill per visible question, replacing the old progress-bar +
   "Question X of N" counter (added 2026-10-31) -- numbered by visible
   position, filled in once answered, highlighted on the current one, and
   free to click to jump straight to any question (this is Corey's own
   working tool, not a gated client form, so there's no reason to lock
   ahead). The row scrolls horizontally with the two arrow buttons when
   it's longer than the available width (also usable with a trackpad/
   touch swipe directly on the row). */
function renderPills(idx){
  var pillsHost = document.getElementById('wizardPills');
  var hoverLabel = document.getElementById('wizardPillHoverLabel');
  pillsHost.innerHTML = '';
  var visIdxs = [];
  STEPS.forEach(function(st, i){ if(stepIsVisible(st)) visIdxs.push(i); });
  visIdxs.forEach(function(stepIdx, pos){
    var pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'wizard-pill' +
      (stepIdx === idx ? ' is-current' : '') +
      (answersByIndex[stepIdx] ? ' is-answered' : '');
    pill.textContent = String(pos + 1);
    pill.addEventListener('click', function(){
      if(stepIdx === current) return;
      saveCurrentStepAnswer();
      renderStep(stepIdx);
    });
    /* Rollover copy, not a native tooltip -- swaps the small left-aligned
       line below the pills (where the session name used to sit) to show
       this pill's question while hovering, then reverts to the current
       question on mouse-out. Added 2026-11-02. */
    pill.addEventListener('mouseenter', function(){
      hoverLabel.textContent = STEPS[stepIdx].q;
    });
    pill.addEventListener('mouseleave', function(){
      hoverLabel.textContent = STEPS[current].q;
    });
    pillsHost.appendChild(pill);
  });
  var currentPos = visIdxs.indexOf(idx);
  var currentPillEl = pillsHost.children[currentPos];
  if(currentPillEl) currentPillEl.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
  hoverLabel.textContent = STEPS[idx].q;
}

function renderStep(idx){
  current = idx;
  var step = STEPS[idx];
  renderPills(idx);

  var host = document.getElementById('wizardStep');
  host.innerHTML = '';
  var qEl = document.createElement('p');
  qEl.className = 'wizard-question';
  qEl.textContent = step.q;

  if(step.type === 'text'){
    var ta = document.createElement('textarea');
    ta.id = 'wizardInput';
    ta.value = answersByIndex[idx] || '';
    host.appendChild(ta);
    setTimeout(function(){ ta.focus(); }, 0);
    /* Optional short named field below the main textarea -- added
       2026-11-02 for the Moodboard/Concept Review reaction questions,
       so each one can be named (e.g. "Warm & Minimal"). Generic on the
       step so any text step can carry one via step.extraField. */
    if(step.extraField){
      var efLbl = document.createElement('label');

    }
  } else if(step.type === 'select'){
    var row = document.createElement('div');
    row.className = 'choice-row';
    step.options.forEach(function(opt){

      chip.type = 'button';

      chip.addEventListener('click', function(){
        row.querySelectorAll('.choice-chip').forEach(function(c){ c.classList.remove('is-selected'); });
        chip.classList.add('is-selected');
        answersByIndex[idx] = opt;
        if(step.key) answersByKey[step.key] = opt;
      });
      row.appendChild(chip);
    });
    host.appendChild(row);
  } else if(step.type === 'nameField'){
    var nf = document.createElement('input');
    nf.type = 'text';
    nf.id = 'wizardInput';
    nf.className = 'wizard-short-input';

  } else if(step.type === 'date'){
    var dLbl = document.createElement('label');
    dLbl.className = 'wizard-step-hint';
    dLbl.style.display = 'block';
    dLbl.style.margin = '0 0 8px';
    dLbl.textContent = step.dateLabel || 'Date';
    host.appendChild(dLbl);
    var dIn = document.createElement('input');
    dIn.type = 'date';
    dIn.id = 'wizardInput';
    dIn.className = 'wizard-date-input';
    dIn.value = answersByIndex[idx] || '';
    host.appendChild(dIn);
  } else if(step.type === 'dateRange'){
    var rowWrap = document.createElement('div');
    rowWrap.className = 'date-range-row';

    var fromWrap = document.createElement('div');
    var fromLbl = document.createElement('label');
    fromLbl.className = 'wizard-step-hint';
    fromLbl.textContent = 'From';
    var fromIn = document.createElement('input');
    fromIn.type = 'date';
    fromIn.id = 'wizardDateFrom';
    fromIn.className = 'wizard-date-input';
    fromIn.value = (dateRangeValues[idx] && dateRangeValues[idx].from) || '';
    fromWrap.appendChild(fromLbl); fromWrap.appendChild(fromIn);

    var toWrap = document.createElement('div');
    var toLbl = document.createElement('label');
    toLbl.className = 'wizard-step-hint';
    toLbl.textContent = 'To';
    var toIn = document.createElement('input');
    toIn.type = 'date';
    toIn.id = 'wizardDateTo';
    toIn.className = 'wizard-date-input';
    toIn.value = (dateRangeValues[idx] && dateRangeValues[idx].to) || '';
    toWrap.appendChild(toLbl); toWrap.appendChild(toIn);

    rowWrap.appendChild(fromWrap);
    rowWrap.appendChild(toWrap);
    host.appendChild(rowWrap);

    var durationEl = document.createElement('p');
    durationEl.className = 'date-range-duration';
    durationEl.id = 'dateRangeDuration';
    host.appendChild(durationEl);
    var updateDateRangeDuration = function(){
      durationEl.textContent = formatDateRangeDuration(fromIn.value, toIn.value);
    };
    fromIn.addEventListener('change', updateDateRangeDuration);
    toIn.addEventListener('change', updateDateRangeDuration);
    updateDateRangeDuration();
  } else if(step.type === 'redFlags'){
    var rfWrap = document.createElement('div');
    rfWrap.className = 'red-flags-wrap';
    [1, 2, 3].forEach(function(n){
      var lbl = document.createElement('label');
      lbl.className = 'wizard-step-hint';
      lbl.style.display = 'block';
      lbl.style.margin = n === 1 ? '0 0 6px' : '14px 0 6px';
      lbl.textContent = 'Red flag ' + n + (n === 1 ? '' : ' (optional)');
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.id = 'wizardRedFlag' + n;
      inp.className = 'wizard-short-input';
      inp.value = (redFlagValues[idx] && redFlagValues[idx][n - 1]) || '';
      rfWrap.appendChild(lbl);
      rfWrap.appendChild(inp);
    });
    host.appendChild(rfWrap);
  } else if(step.type === 'pointOfContact'){
    host.appendChild(buildPointOfContactWidget(idx));
  } else if(step.type === 'linkList'){
    host.appendChild(buildLinkListWidget(idx));
  }

  // Back is never disabled, even on the first question -- goBack() already
  // knows to return to the intro screen (and pick a different session)
  // once there's no earlier question to go to.
  document.getElementById('wizardBackBtn').disabled = false;
  var isLast = findNext(idx) >= STEPS.length;
  document.getElementById('wizardNextBtn').textContent = isLast ? 'Save to Client File' : 'Next';
  document.getElementById('wizardSkipBtn').style.display = (step.type === 'select') ? 'none' : '';
}

function saveCurrentStepAnswer(){
  var step = STEPS[current];
  if(step.type === 'text'){
    var ta = document.getElementById('wizardInput');
    answersByIndex[current] = ta ? ta.value.trim() : '';
    if(step.extraField){
      var efIn = document.getElementById('wizardExtraField');
      answersByKey[step.extraField.key] = efIn ? efIn.value.trim() : '';
    }
  } else if(step.type === 'nameField'){
    var nf = document.getElementById('wizardInput');
    answersByIndex[current] = nf ? nf.value.trim() : '';
  } else if(step.type === 'date'){
    var dIn = document.getElementById('wizardInput');
    answersByIndex[current] = dIn ? dIn.value : '';
  } else if(step.type === 'dateRange'){
    var fromEl = document.getElementById('wizardDateFrom');
    var toEl = document.getElementById('wizardDateTo');
    var fromV = fromEl ? fromEl.value : '';
    var toV = toEl ? toEl.value : '';
    dateRangeValues[current] = { from:fromV, to:toV };
    var drParts = [];
    if(fromV) drParts.push('From ' + fromV);
    if(toV) drParts.push('To ' + toV);
    answersByIndex[current] = drParts.join(' — ');
  } else if(step.type === 'redFlags'){
    var vals = [1, 2, 3].map(function(n){
      var el = document.getElementById('wizardRedFlag' + n);
      return el ? el.value.trim() : '';
    });
    redFlagValues[current] = vals;
    answersByIndex[current] = vals.filter(Boolean).join(' | ');
  } else if(step.type === 'pointOfContact'){
    answersByIndex[current] = savePointOfContactWidget(current);
  } else if(step.type === 'linkList'){
    answersByIndex[current] = saveLinkListWidget(current);
  }
  // 'select' steps already save onto answersByIndex/answersByKey at click time
}

function goNext(){
  saveCurrentStepAnswer();
  var step = STEPS[current];
  if(step.onAdvance) step.onAdvance(current, answersByIndex[current]);
  var next = findNext(current);
  if(next >= STEPS.length){
    submitMeetingNote();
    return;
  }
  renderStep(next);
}
function goBack(){
  saveCurrentStepAnswer();
  var prev = findPrev(current);
  if(prev === -1){
    leaveWizardToIntro();
    return;
  }
  renderStep(prev);
}

    contactEntries[current] = [{ name:'', email:'', phone:'', bestWay:'' }];

/* Client history lookup -- added 2026-11-02, per Corey's request. Fires
   automatically once both name and email are filled in (on leaving the
   email field, so it's not re-querying on every keystroke), calling the
   same Apps Script endpoint everything else here already POSTs to, this
   time as a GET with action=clientHistory. The script looks the email up
   in the Client Index read-only -- it never creates a tab for an email
   it doesn't recognize, so an unknown or mistyped address just comes
   back empty rather than cluttering the Sheet. See adjuis-estimates-
   Code.gs's getClientHistoryForEmail() for the other half of this. */
function renderClientHistory(data){
  var panel = document.getElementById('clientHistory');
  var titleEl = document.getElementById('clientHistoryTitle');
  var sessionsEl = document.getElementById('clientHistorySessions');
  sessionsEl.innerHTML = '';
  if(!data || !data.found || !data.sessions || !data.sessions.length){
    panel.style.display = 'none';
    return;
  }
  titleEl.textContent = data.sessions.length + ' past session' + (data.sessions.length === 1 ? '' : 's') + ' on file';
  data.sessions.forEach(function(sess){
    var row = document.createElement('div');
    row.className = 'client-history-row';

    var head = document.createElement('button');
    head.type = 'button';
    head.className = 'client-history-row-head';
    var dateLabel = '';
    try {
      var d = new Date(sess.timestamp);
      if(!isNaN(d.getTime())) dateLabel = d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    } catch(e){}
    var labelSpan = document.createElement('span');
    labelSpan.textContent = (sess.session || sess.entryType || 'Session') + (dateLabel ? ' (' + dateLabel + ')' : '');
    head.appendChild(labelSpan);

    var body = document.createElement('div');
    body.className = 'client-history-row-body';
    body.style.display = 'none';
    (sess.answers || []).forEach(function(qa){
      if(!qa.answer) return;
      var qEl = document.createElement('p');
      qEl.className = 'client-history-q';
      qEl.textContent = qa.question;
      var aEl = document.createElement('p');
      aEl.className = 'client-history-a';
      aEl.textContent = qa.answer;
      body.appendChild(qEl);
      body.appendChild(aEl);
    });

    head.addEventListener('click', function(){
      var isOpen = body.style.display !== 'none';
      body.style.display = isOpen ? 'none' : '';
      head.classList.toggle('is-open', !isOpen);
    });

    row.appendChild(head);
    row.appendChild(body);
    sessionsEl.appendChild(row);
  });
  panel.style.display = '';
}
function lookupClientHistory(){
  var name = document.getElementById('cName').value.trim();
  var email = document.getElementById('cEmail').value.trim();
  var panel = document.getElementById('clientHistory');
  if(!name || !email || !SUBMIT_ENDPOINT){ panel.style.display = 'none'; return; }
  fetch(SUBMIT_ENDPOINT + '?action=clientHistory&email=' + encodeURIComponent(email))
    .then(function(r){ return r.json(); })
    .then(function(data){ renderClientHistory(data); })
    .catch(function(){ panel.style.display = 'none'; });
}
document.getElementById('cEmail').addEventListener('blur', lookupClientHistory);

function buildSummaryText(title, fields){
  var lines = [title, ''];
  fields.forEach(function(f){
    if(f[1] === null || f[1] === undefined || f[1] === '') return;
    lines.push(f[0] + ': ' + f[1]);
  });
  lines.push('', 'Adjuis — the creative house of C Mecca', 'adjuis.com');
  return lines.join('\n');
}
function downloadSummaryText(filename, text){
  var blob = new Blob([text], { type:'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function emailSummaryCopy(email, subject, text, msgEl){
  if(!email){ msgEl.textContent = 'Add the client email above first.'; msgEl.className = 'copy-actions-msg is-bad'; return; }
  if(!SUBMIT_ENDPOINT){ msgEl.textContent = "Email delivery isn't connected in this preview."; msgEl.className = 'copy-actions-msg is-bad'; return; }
  msgEl.textContent = 'Sending...'; msgEl.className = 'copy-actions-msg';
  fetch(SUBMIT_ENDPOINT, {
    method:'POST', mode:'no-cors',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ type:'emailCopy', email: email, subject: subject, body: text, submittedAt: new Date().toISOString() })
  }).then(function(){ msgEl.textContent = 'Sent — check your inbox in a minute.'; msgEl.className = 'copy-actions-msg is-ok'; })
    .catch(function(){ msgEl.textContent = 'Something went wrong, try the download instead.'; msgEl.className = 'copy-actions-msg is-bad'; });
}

var lastSubmission = null;

function submitMeetingNote(){
  var name = document.getElementById('cName').value.trim();
  var email = document.getElementById('cEmail').value.trim();
  var company = document.getElementById('cCompany').value.trim();
  var phone = document.getElementById('cPhone').value.trim();

  var answers = [];
  STEPS.forEach(function(step, idx){
    if(!stepIsVisible(step)) return;
    var val = answersByIndex[idx];
    if(val) answers.push({ question: step.q, answer: val });
    if(step.extraField){
      var efVal = answersByKey[step.extraField.key];
      if(efVal) answers.push({ question: step.extraField.label, answer: efVal });
    }
  });

  var mindMapText = hasMindMapContent(currentSession) ? saveMindMapWidget(currentSession) : '';

  var payload = { type:'meetingNote', session:currentSession, name:name, email:email, company:company, phone:phone, answers:answers, mindMap:mindMapText, submittedAt:new Date().toISOString() };
  lastSubmission = payload;

  function done(ok){
    if(ok){
      document.getElementById('maWizard').style.display = 'none';
      document.getElementById('maSubmitSuccess').style.display = 'block';
    } else {
      var host = document.getElementById('wizardStep');
      var err = document.createElement('p');
      err.className = 'submit-msg is-bad';
      err.textContent = 'Something went wrong sending that, try Save again in a moment.';
      host.appendChild(err);
    }
  }
  if(!SUBMIT_ENDPOINT){ done(true); return; }
  fetch(SUBMIT_ENDPOINT, {
    method:'POST', mode:'no-cors',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(function(){ done(true); }).catch(function(){ done(false); });
}

function meetingSummary(){
  if(!lastSubmission) return { text:'', filename:'adjuis-meeting-note.txt', email:'' };
  var p = lastSubmission;
  var fields = [['Client', p.name], ['Company', p.company], ['Email', p.email], ['Session', p.session]];
  p.answers.forEach(function(qa){ fields.push([qa.question, qa.answer]); });
  if(p.mindMap) fields.push(['Mind Map', p.mindMap]);
  var text = buildSummaryText('Adjuis Meeting Notes — ' + p.session, fields);
  return { text:text, filename:'adjuis-meeting-note.txt', email:p.email };
}
document.getElementById('maDownloadBtn').addEventListener('click', function(){
  var s = meetingSummary(); if(s.text) downloadSummaryText(s.filename, s.text);
});
document.getElementById('maEmailBtn').addEventListener('click', function(){
  var s = meetingSummary();
  emailSummaryCopy(s.email, 'Adjuis Meeting Notes', s.text, document.getElementById('maCopyMsg'));
});
</script>
