<title>Adjuis</title>
<style>
  :root{
    --line:rgba(255,255,255,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:#0a0a0d;
    color:#f7f6f4;
    font-family:'Inter','Helvetica Neue',Arial,sans-serif;
    overflow:hidden;
  }
  button,a{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer;text-decoration:none;}

  #bgVideo{
    position:fixed; inset:0; z-index:0;
    width:100vw; height:100vh; object-fit:cover;
  }

  #splash{
    position:fixed; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 24px;
    opacity:0;
    animation:pageIn 1.1s ease .1s forwards;
  }
  @keyframes pageIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .word-mark{
    width:clamp(126px,16.8vw,177px);
    aspect-ratio:383.52/120.52;
    display:block;
    margin-bottom:22px;
  }

  .tagline-swap{
    position:relative;
    display:grid;
    justify-content:center;
    align-items:center;
  }
  .tagline-line{
    grid-area:1/1;
    white-space:nowrap;
    font-size:12px; letter-spacing:.2em; text-transform:uppercase;
    color:#f7f6f4;
  }
  .tagline-line .ch{
    display:inline-block;
    white-space:pre;
    opacity:1;
    transition:opacity .22s ease;
  }
  .tagline-line.is-second .ch{ opacity:0; }
  @media (max-width:340px){
    .tagline-line{ letter-spacing:.11em; }
  }

  .cta{
    margin-top:64px;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:#f7f6f4;
    background:rgba(0,0,0,.18);
    border:1px solid #f3a7c6; border-radius:10px;
    padding:9px 26px;
    display:inline-block;
    transition:background .3s ease, border-color .3s ease, transform .3s ease;
  }
  .cta:hover{ background:rgba(0,0,0,.28); border-color:#f7c3da; transform:translateY(-1px); }

  .awards-flank{
    margin-top:64px;
    display:flex; align-items:center; justify-content:center;
    gap:28px;
  }
  .awards-row{
    display:flex; align-items:center; justify-content:center;
    gap:36px; flex-wrap:wrap;
  }
  .award-logo{ opacity:.85; transition:opacity .3s ease; display:block; }
  .award-logo:hover{ opacity:1; }
  .award-logo-marcom{ height:40px; transform:translateY(-5px); }
  .award-logo-webby{ height:28px; }
  .award-logo-streamy{ height:34px; }
  .award-logo-muse{ height:20px; }
  .award-logo-shorty{ height:26px; }

  .laurel{
    display:none;
    height:60px; width:auto;
    opacity:.85;
  }
  .laurel-left{ transform:scaleX(-1); }
  .laurel-right{ transform:scaleX(-1); }
  @media (min-width:860px){
    .laurel{ display:block; }
  }

  .cm-mark{
    margin-top:64px;
    display:flex; align-items:center;
    padding:10px; border-radius:100px;
  }
  .cm-svg{ height:11px; width:auto; overflow:visible; }
  .cm-part{
    fill:#f7f6f4;
    transform-box:view-box;
    transform:translateX(127.22px);
    transition:transform .6s cubic-bezier(.4,0,.2,1);
  }
  .cm-ecca{
    fill:#f7f6f4;
    transform-box:fill-box; transform-origin:0% 50%;
    opacity:0; transform:translateX(-8px) scale(.92);
    transition:opacity .6s cubic-bezier(.4,0,.2,1), transform .6s cubic-bezier(.4,0,.2,1);
  }
  .cm-mark:hover .cm-part, .cm-mark.auto-expanded .cm-part{ transform:translateX(0); }
  .cm-mark:hover .cm-ecca, .cm-mark.auto-expanded .cm-ecca{ opacity:1; transform:translateX(0) scale(1); transition-delay:.15s; }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }
</style>

<script>
(function(){
  // Pick one of the background clips at random on every load.
  var bgVideo = document.getElementById('bgVideo');
  if(!bgVideo){ return; }
  var sources = [
    'assets/videos/bg-original.mp4', // original (seamless loop, forward only)
    'assets/videos/bg-fluid-gold-purple.mp4', // fluid motion, gold & purple (seamless loop, forward only)
    'assets/videos/bg-pink-purple-clouds.mp4', // pink & purple clouds (seamless loop, forward only)
    'assets/videos/bg-swirling-purple-orange.mp4', // swirling purple & orange paint with gold (seamless loop, forward only)
    'assets/videos/bg-swirling-liquid-purple-gold.mp4'  // swirling liquid purple & gold (seamless loop, forward only)
  ];
  var pick = sources[Math.floor(Math.random() * sources.length)];
  bgVideo.src = pick;
  bgVideo.load();
  var playPromise = bgVideo.play();
  if(playPromise && typeof playPromise.catch === 'function'){
    playPromise.catch(function(){ /* autoplay blocked -- video stays paused on first frame */ });
  }
})();

(function(){
  var cmMark = document.querySelector('.cm-mark');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced || !cmMark){ return; }

  // reveal to "C MECCA" shortly after load, hold for ~15s, then collapse back to "CM" once.
  var showDelay = 900;   // let the page-in animation settle first
  var holdTime = 15000;  // how long it stays expanded before animating off

  setTimeout(function(){
    cmMark.classList.add('auto-expanded');
    setTimeout(function(){
      cmMark.classList.remove('auto-expanded');
    }, holdTime);
  }, showDelay);
})();

(function(){
  var taglineSwap = document.getElementById('taglineSwap');
  var first = document.getElementById('taglineFirst');
  var second = document.getElementById('taglineSecond');
  if(!taglineSwap || !first || !second){ return; }

  // Split each line's text into one span per character so opacity can be
  // driven letter by letter instead of on the line as a whole.
  function splitChars(el){
    var text = el.textContent;
    el.textContent = '';
    for(var i = 0; i < text.length; i++){
      var span = document.createElement('span');
      span.className = 'ch';
      span.textContent = text[i];
      el.appendChild(span);
    }
    return el.querySelectorAll('.ch');
  }

  var firstChars = splitChars(first);
  var secondChars = splitChars(second);

  var STAGGER = 16;   // ms between each letter's turn, left to right
  var OUT_DUR = 220;  // how long one letter takes to lose its opacity
  var IN_DUR = 260;   // how long one letter takes to gain it back
  var OVERLAP = 1;    // incoming line waits until the outgoing sweep fully clears (same grid cell -- any overlap garbles the two strings together)

  function letterWipe(outChars, inChars){
    var last = 0;
    outChars.forEach(function(ch, i){
      var delay = i * STAGGER;
      ch.style.transition = 'opacity ' + OUT_DUR + 'ms ease ' + delay + 'ms';
      ch.style.opacity = '0';
      last = delay + OUT_DUR;
    });
    setTimeout(function(){
      inChars.forEach(function(ch, i){
        var delay = i * STAGGER;
        ch.style.transition = 'opacity ' + IN_DUR + 'ms ease ' + delay + 'ms';
        ch.style.opacity = '1';
      });
    }, last * OVERLAP);
  }

  var holdTime = 5000;
  setTimeout(function(){
    letterWipe(firstChars, secondChars);
  }, holdTime);
})();

(function(){
  // some mobile browsers won't follow a mailto: link when the page is inside a
  // sandboxed iframe (as a published artifact is); forcing it through window.open
  // on the click gesture itself is the reliable workaround.
  var btn = document.getElementById('ctaBtn');
  if(!btn){ return; }
  btn.addEventListener('click', function(e){
    e.preventDefault();
    var href = btn.getAttribute('href');
    var win = window.open(href, '_blank');
    if(!win){ window.location.href = href; }
  });
})();
</script>
